[project]
name = "lucknow-tech-events-backend"
version = "0.1.0"
description = "Backend for Lucknow tech events aggregator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "httpx>=0.27",
  "playwright>=1.47",
  "playwright-stealth>=1.0.6",
  "celery>=5.4",
  "redis>=5.0",
  "structlog>=24.4",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "slowapi>=0.1.9",
  "icalendar>=5.0",
  "python-slugify>=8.0",
  "python-dateutil>=2.9",
  "pytz>=2024.1",
  "google-genai>=1.0.0",
  # --- Engine V1 (backend/v1) ---
  "pyyaml>=6.0",          # instance config files
  "openai>=1.60",         # the openai_compatible adapter: Groq, OpenRouter, LM Studio, vLLM
  "tenacity>=8.5",        # jittered backoff for provider transport retries
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",          # HTTP mocking for adapter tests
  "import-linter>=2.0",   # enforces the v1 module-boundary contracts
  "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: hits a real provider and may cost money; deselected unless V1_LLM_ALLOW_LIVE=1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "api*", "workers*", "ingestion*", "v1*"]
