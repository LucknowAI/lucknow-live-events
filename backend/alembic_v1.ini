; Alembic configuration for the V1 engine only.
;
;   cd backend && alembic -c alembic_v1.ini upgrade head
;
; Reads V1_DATABASE_URL (or V1_ALEMBIC_DATABASE_URL) from the environment — the URL is
; not in this file so it can never be committed. Writes its version history to
; engine_v1.alembic_version_v1, which the V0 `alembic.ini` never touches.

[alembic]
script_location = v1/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
