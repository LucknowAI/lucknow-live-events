# =============================================================================
# Engine V1 — reference instance configuration
# =============================================================================
# ADR-013: an instance is data, not a fork. Every value that is specific to *this*
# deployment lives in this file. No engine .py file contains a city name, a model ID,
# a token price, or a timezone.
#
# Secrets are NEVER in this file. `api_key_ref` names an environment variable (or a
# file under $V1_SECRETS_DIR); config validation rejects anything in a `*_ref` field
# that is not an UPPER_SNAKE variable name.
#
# Switching every LLM call to a local model is one line: `llm.default: local_lmstudio`.
# Switching only extraction is one line under `llm.tasks`.
# =============================================================================

config_version: 1

tenant:
  slug: lucknow
  name: Lucknow Tech Events
  timezone: Asia/Kolkata

llm:
  # The profile used by any task without an explicit override below.
  default: gemini_flash_lite

  budget:
    # Hard cost circuit breaker, per `08 §2.4`. Applies to LLM spend; SERP spend joins
    # the same accounting module in Phase 2.
    daily_usd_cap: 2.00

    # halt: raise BudgetExceeded and make no call.
    # degrade_to_fixture: keep running on recorded responses (requires degrade_profile).
    # halt is the default on purpose — silently degrading to fixtures in production would
    # publish fabricated events.
    on_exceeded: halt

    # memory: in-process counter. Fine for dev/CI; resets on restart.
    # postgres: engine_v1.llm_call rows; survives restart. REQUIRED outside development —
    # the app refuses to start with a memory ledger when V1_ENVIRONMENT != development.
    # Override per-process with V1_LLM_BUDGET_LEDGER.
    ledger: memory

  # Per-task routing. A task name not listed here falls back to `default`.
  tasks:
    extraction: gemini_flash_lite
    classification: groq_strict
    dedup_tiebreak: groq_strict
    url_triage: groq_strict

  profiles:
    # ---------------------------------------------------------------- Gemini (primary)
    # `06 §13` keeps Gemini as the reference AI implementation. Native `response_schema`
    # is stricter than the OpenAI compatibility layer, so it gets its own adapter.
    gemini_flash_lite:
      adapter: gemini_native
      model: gemini-3.1-flash-lite
      api_key_ref: GEMINI_API_KEY
      structured_output: native_schema
      temperature: 0.1
      max_output_tokens: 4096
      timeout_s: 60
      max_retries: 2
      pricing:
        input_usd_per_mtok: 0.25
        output_usd_per_mtok: 1.50
        source: https://ai.google.dev/gemini-api/docs/pricing
        as_of: 2026-08-06

    # Escalation profile for pages the cheap model gets wrong. Not wired to any task yet.
    gemini_flash:
      adapter: gemini_native
      model: gemini-3.5-flash
      api_key_ref: GEMINI_API_KEY
      structured_output: native_schema
      temperature: 0.1
      max_output_tokens: 8192
      pricing:
        input_usd_per_mtok: 1.50
        output_usd_per_mtok: 9.00
        source: https://ai.google.dev/gemini-api/docs/pricing
        as_of: 2026-08-06

    # ------------------------------------------------------------------------- Groq
    # Groq restricts `strict: true` constrained decoding to the openai/gpt-oss-* models;
    # every other model silently ignores `strict`.
    # https://console.groq.com/docs/structured-outputs
    # Config validation enforces this — declaring native_schema on a Llama model fails.
    groq_strict:
      adapter: openai_compatible
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-20b
      api_key_ref: GROQ_API_KEY
      structured_output: native_schema
      temperature: 0.1
      max_output_tokens: 4096
      pricing:
        input_usd_per_mtok: 0.075
        output_usd_per_mtok: 0.30
        source: https://console.groq.com/docs/models
        as_of: 2026-08-06

    groq_llama:
      adapter: openai_compatible
      base_url: https://api.groq.com/openai/v1
      model: llama-3.3-70b-versatile
      api_key_ref: GROQ_API_KEY
      # Honest declaration: schema is sent, not enforced. The port validates client-side
      # and uses its repair attempt when needed.
      structured_output: json_schema_best_effort
      temperature: 0.1
      max_output_tokens: 4096
      pricing:
        input_usd_per_mtok: 0.59
        output_usd_per_mtok: 0.79
        source: https://console.groq.com/docs/models
        as_of: 2026-08-06

    # ------------------------------------------------------------------- OpenRouter
    # One key, many models. `require_parameters` makes OpenRouter route only to endpoints
    # that actually support structured outputs, which is what justifies claiming
    # native_schema here. https://openrouter.ai/docs/features/structured-outputs
    openrouter_any:
      adapter: openai_compatible
      base_url: https://openrouter.ai/api/v1
      model: openai/gpt-oss-120b
      api_key_ref: OPENROUTER_API_KEY
      structured_output: native_schema
      max_output_tokens: 4096
      extra_body:
        provider:
          require_parameters: true
      pricing:
        # OpenRouter price varies by the route it picks; this is the accounting ceiling.
        input_usd_per_mtok: 0.15
        output_usd_per_mtok: 0.60
        source: https://openrouter.ai/models (route-dependent; ceiling for accounting)
        as_of: 2026-08-06

    # ------------------------------------------------------------- local (zero cost)
    # LM Studio implements OpenAI's structured-output shape, backed by llama.cpp grammars
    # for GGUF models. Models under ~7B frequently cannot do structured output at all.
    # https://lmstudio.ai/docs/developer/openai-compat/structured-output
    local_lmstudio:
      adapter: openai_compatible
      base_url: http://localhost:1234/v1
      model: qwen2.5-14b-instruct
      api_key_ref: null
      structured_output: native_schema
      max_output_tokens: 4096
      timeout_s: 180

    # Ollama's /v1/chat/completions still does not accept OpenAI's response_format
    # json_schema shape (ollama/ollama#10001), so this uses the native /api/chat `format`
    # field, which is grammar-constrained.
    # https://docs.ollama.com/capabilities/structured-outputs
    local_ollama:
      adapter: ollama_native
      base_url: http://localhost:11434
      model: qwen2.5:14b
      structured_output: native_schema
      max_output_tokens: 4096
      timeout_s: 180

    # ---------------------------------------------------------------- deterministic
    # Replays recorded provider responses. Zero cost, byte-identical every run — what CI
    # uses, and what a demo uses when no key is present.
    ci_fixture:
      adapter: fixture
      structured_output: native_schema
      fixture_dir: tests/v1/fixtures/llm

    # Generates schema-valid synthetic values with no fixture files at all. Used for the
    # port's own plumbing tests and as a smoke target for new schemas.
    ci_mock:
      adapter: mock
      structured_output: native_schema
